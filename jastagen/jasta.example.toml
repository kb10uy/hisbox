# Entrant details for the JASTA SSTV Activity Contest summary sheet.
# Everything here is copied onto the sheet verbatim; the log supplies the rest.

contest_name = "JASTA SSTV activity contest"

[entry]
callsign = "JL1HIS"

# "J" for a station in Japan, "S" for one outside it. A Japanese operator
# working from abroad enters as "S". This also picks the summary language.
